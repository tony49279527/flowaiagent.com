<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析进行中 - Product Discovery | FlowAI Agent</title>
    <link rel="stylesheet" href="styles.css?v=2.0">
    <style>
        .processing-container {
            max-width: 800px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .status-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: var(--bg-soft);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .live-log {
            margin-top: 40px;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            color: #94a3b8;
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
        }

        .log-entry.active {
            color: #38bdf8;
        }

        .log-entry.success {
            color: #4ade80;
        }

        .log-time {
            color: #64748b;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <div class="processing-container">
                <div class="status-icon">
                    <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="40" height="40"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                </div>
                <h1 id="main-status">AI 选品专家正在分析中...</h1>
                <p id="sub-status">正在调取全球亚马逊实时数据，这通常需要 2-5 分钟。</p>

                <div class="progress-bar-bg" style="margin-top: 30px;">
                    <div class="progress-bar-fill" id="main-progress" style="width: 10%;"></div>
                </div>

                <div class="live-log" id="log-container">
                    <div class="log-entry"><span class="log-time"></span> [系统] 选品引擎初始化成功...</div>
                </div>

                <div style="margin-top: 20px; font-size: 0.85em; color: #94a3b8;">
                    正在使用模型: <span id="ai-model-display" style="color: #60a5fa; font-weight: 500;">...</span>
                </div>

                <div style="margin-top: 40px; padding: 20px; border-top: 1px solid #f1f5f9;">
                    <p style="color: #64748b; font-size: 0.9em;">完成后报告将发送至：<strong id="user-email-display">...</strong>
                    </p>
                    <p style="color: #94a3b8; font-size: 0.8em; margin-top: 10px;">您可以关闭此页面，分析不受影响。</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId');
        const userEmail = sessionStorage.getItem('discovery_email') || urlParams.get('email') || '';
        const aiModelParam = urlParams.get('model') || 'anthropic/claude-sonnet-4.5';
        const aiModelDisplay = aiModelParam === 'anthropic/claude-sonnet-4.5' ? 'Claude Sonnet 4.5' : aiModelParam;

        document.getElementById('user-email-display').textContent = userEmail || '您的邮箱';
        document.getElementById('ai-model-display').textContent = aiModelDisplay;

        const logContainer = document.getElementById('log-container');
        const mainStatus = document.getElementById('main-status');
        const progressBar = document.getElementById('main-progress');

        const STAGE_LOGS = [
            '多维数据矩阵构建完成，开始 AI 深度建模...',
            '正在分析竞品评论与用户痛点...',
            '正在生成定价策略与价格带建议...',
            '正在挖掘蓝海机会与差异化方向...',
            '正在整合市场格局与进入策略...',
            '正在撰写执行计划与风险雷达...',
            '报告结构已成型，正在润色与补充细节...'
        ];
        let stageLogIndex = 0;
        let analyzingLogAdded = false;
        let isCompleted = false;
        const startTime = Date.now();
        const PROGRESS_DURATION_MS = 4 * 60 * 1000; // 假设典型耗时约 4 分钟

        function addLog(text, type = '') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span class="log-time">${time}</span> ${text}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateProgressWhileAnalyzing() {
            if (isCompleted) return;
            const elapsed = Date.now() - startTime;
            const pct = Math.min(92, 10 + (elapsed / PROGRESS_DURATION_MS) * 82);
            progressBar.style.width = pct + '%';
        }

        // 每 35 秒添加一条阶段性日志（避免单调重复）
        const stageInterval = setInterval(() => {
            if (isCompleted) { clearInterval(stageInterval); return; }
            if (stageLogIndex < STAGE_LOGS.length - 1) {
                stageLogIndex++;
                addLog(STAGE_LOGS[stageLogIndex], 'active');
            }
        }, 35000);

        let dots = 0;
        let pollTimer = null;
        let progressTimer = null;
        let hasFailureLog = false;
        const dotInterval = setInterval(() => {
            dots = (dots + 1) % 4;
            mainStatus.textContent = 'AI 选品专家正在分析中' + '.'.repeat(dots);
        }, 500);

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        async function pollStatus() {
            if (!taskId) return;

            try {
                const res = await fetch(`/api/discovery/status?task_id=${taskId}`);
                const data = await res.json();

                if (data.status === 'ANALYZING') {
                    updateProgressWhileAnalyzing();
                    if (!analyzingLogAdded) {
                        analyzingLogAdded = true;
                        addLog(STAGE_LOGS[0], 'active');
                    }
                } else if (data.status === 'COMPLETED' || data.status === 'COMPLETED_NO_EMAIL') {
                    isCompleted = true;
                    stopPolling();
                    clearInterval(stageInterval);
                    clearInterval(dotInterval);
                    progressBar.style.width = '100%';
                    mainStatus.textContent = '分析完成！';
                    addLog('报告生成成功！', 'success');
                    if (data.status === 'COMPLETED') {
                        addLog('邮件已成功发送。', 'success');
                    }
                    setTimeout(() => {
                        window.location.href = `success.html?type=discovery&task=${taskId}`;
                    }, 2000);
                } else if (data.status === 'FAILED') {
                    isCompleted = true;
                    stopPolling();
                    clearInterval(stageInterval);
                    clearInterval(dotInterval);
                    mainStatus.textContent = '分析遇到问题';
                    progressBar.style.width = '100%';
                    if (!hasFailureLog) {
                        hasFailureLog = true;
                        const backendError = data.error_message ? `后端返回：${data.error_message}` : '';
                        addLog(`分析暂时无法完成，请稍后重试或联系客服 contact@amzaiagent.com ${backendError}`.trim(), 'error');
                    }
                }
            } catch (e) {
                console.warn('Poll error:', e);
            }
        }

        // 初始日志
        setTimeout(() => addLog('正在扫描指定类目的市场饱和度...'), 2000);
        setTimeout(() => addLog('探测到潜在蓝海差异化切入点...', 'active'), 5000);

        pollTimer = setInterval(pollStatus, 5000);
        progressTimer = setInterval(updateProgressWhileAnalyzing, 8000); // 每 8 秒更新一次进度条
        pollStatus();
    </script>
</body>

</html>
